name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 👇 Checkout email-service (current repo)
      - name: Checkout email-service
        uses: actions/checkout@v4

      # 👇 Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 👇 Clone orderEvent repo
      - name: Checkout orderEvent
        uses: actions/checkout@v4
        with:
          repository: satyendrashiroya07/orderEvent
          path: orderEvent

      # 👇 Build orderEvent FIRST (skip tests)
      - name: Build orderEvent
        run: mvn clean install -DskipTests -f orderEvent/pom.xml

      # 👇 Build email-service (skip tests)
      - name: Build email-service
        run: mvn -B package -DskipTests --file pom.xml